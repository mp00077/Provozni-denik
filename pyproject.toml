[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "provozni-denik"
version = "0.1.0"
description = "Evidence přístupů do serverovny"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
provozni-denik = "provozni_denik.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provozni_denik = ["infrastructure/database/migrations/*.sql", "ui/forms/*.ui", "ui/resources/*.qrc"]
